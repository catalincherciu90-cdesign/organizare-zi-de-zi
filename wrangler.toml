name = "organizare-zi-de-zi"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Site static (public/) servit de Worker prin binding-ul ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"

# ————— Stocare (Durable Object, creat automat la deploy) —————
# Nu necesită nicio configurare manuală: la `wrangler deploy`, Cloudflare creează
# singur Durable Object-ul pe baza migrării de mai jos. Backend SQLite → eligibil pe
# planul gratuit.
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# ————— Deploy —————
#   npx wrangler deploy   (sau automat prin Workers Builds la push pe main)
#
# ————— Acces organizator —————
# Implicit: organizatorul își setează parola la prima intrare pe /organizator.
# Opțional, poți fixa în schimb un token ca secret:
#   npx wrangler secret put ORGANIZER_TOKEN
#
# Opțional, generare plan printr-un model (altfel mod demo):
#   npx wrangler secret put ANTHROPIC_API_KEY
